 version: '2.1'

 services:

# ------------------------------------------------------------------------------------
  # HiveMQ Edge
  # docker run --name hivemq-edge -e HIVEMQ_LOG_LEVEL=INFO -d -p 1883:1883 -p 8080:8080 hivemq/hivemq-edge
  # ------------------------------------------------------------------------------------
  hivemqedge:
    image: hivemq/hivemq-edge:2026.1
    container_name: hivemq-edge
    ports:
       - 2883:1883                     # MQTT/TCP protocol port
       - 2080:8080                     # HiveMQ Edge port
    #  - 2442:2442                     # MQTTSN
       - 2888:8888    # HiveMQ API
    volumes:
     # - ./Hive-edge-config:/opt/hivemq/conf
    environment:
      HIVEMQ_LICENSE: ""
    restart: unless-stopped
    # entrypoint: ["/entrypoint.sh"]